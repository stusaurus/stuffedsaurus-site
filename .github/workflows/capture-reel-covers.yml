name: Capture actual Instagram Reel covers
on:
  push:
    branches:
      - fix/v524-instagram-actual-reel-covers
    paths:
      - preview/instagram-cover-sources.json
      - scripts/download_verified_reel_covers.py
      - .github/workflows/capture-reel-covers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install Pillow==11.3.0
      - name: Download verified Reel cover images and retain aspect ratios
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f preview/instagram-cover-sources.json ]; then
            echo "No input links to download."
            exit 0
          fi
          python scripts/download_verified_reel_covers.py
      - name: Save authentic Reel covers to GitHub
        shell: bash
        run: |
          set -euo pipefail
          if [ -f preview/instagram-cover-sources.json ]; then
            echo "Image download failed; will not commit partial covers"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/instagram-recent.json preview/instagram-covers
          git add -u preview/instagram-cover-sources.json
          git commit -m 'Save real Instagram Reel thumbnail images for website display'
          git push origin HEAD:fix/v524-instagram-actual-reel-covers
