name: V5.20 Instagram recent posts browser QA
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'qa/**'
      - 'scripts/update_instagram_feed.py'
      - 'site.zip'
      - '.github/workflows/pages.yml'
      - '.github/workflows/v520-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instagram-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Build Instagram gallery candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          root=Path('public')
          root.mkdir(exist_ok=True)
          with ZipFile('site.zip') as z:
              z.extractall(root)
          target=root/'preview-v520'
          target.mkdir()
          shutil.copytree(root/'assets',target/'assets')
          html=(root/'index.html').read_text(encoding='utf-8')
          for layer in ('512','513','514'):
              for ext in ('css','js'):
                  src=Path('preview')/f'v{layer}.{ext}'
                  shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
              html=html.replace('</body>',f'<script src="v{layer}.js"></script>\n</body>',1)
          shutil.copy2(Path('preview/v515.css'),target/'v515.css')
          html=html.replace('</head>','<link rel="stylesheet" href="v515.css"/>\n</head>',1)
          for layer in ('516','517','518','519','520'):
              for ext in ('css','js'):
                  src=Path('preview')/f'v{layer}.{ext}'
                  shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
              html=html.replace('</body>',f'<script src="v{layer}.js"></script>\n</body>',1)
          shutil.copy2(Path('preview/instagram-recent.json'),target/'instagram-recent.json')
          shutil.copytree(Path('preview/instagram-covers'),target/'instagram-covers')
          shutil.copytree(Path('preview/instagram-covers'),root/'instagram-covers')
          (target/'index.html').write_text(html,encoding='utf-8')
          shutil.copy2(target/'index.html',root/'index.html')
          for src in target.glob('v5*'):
              shutil.copy2(src,root/src.name)
          shutil.copy2(target/'instagram-recent.json',root/'instagram-recent.json')
          assert 'v520.js' in html and 'v520.css' in html
          PY
      - name: Validate Instagram feed snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('preview/instagram-recent.json').read_text())
          assert x['account']=='stuffed_saurus'
          assert len(x['items'])==3
          assert all(row['url'].startswith('https://www.instagram.com/reel/') for row in x['items'])
          assert [r['published_on'] for r in x['items']]==sorted((r['published_on'] for r in x['items']),reverse=True)
          for p in x['items']:
              cover=Path('preview')/p['cover_path']
              assert cover.is_file() and cover.stat().st_size>20000
              assert p['cover_path'].endswith(p['url'].split('/')[-2]+'.webp')
              assert p['cover_source']=='connected @stuffed_saurus Reel thumbnail'
          PY
      - name: Unit-test source normalization
        run: python3 -m unittest discover -s qa -p 'test_instagram_sync.py' -v
      - name: Browser-test recent reel gallery
        run: |
          python3 -m http.server 8765 -d public >/tmp/stuffedsaurus-http.log 2>&1 &
          npx playwright test qa/v520.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v520-instagram-gallery-screenshots
          path: test-results/
          if-no-files-found: ignore
