name: V5.17 illustrated menu browser QA
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'qa/**'
      - 'site.zip'
      - '.github/workflows/pages.yml'
      - '.github/workflows/v517-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  illustrated-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Assemble V5.17 isolated preview
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import shutil
          root=Path('public')
          root.mkdir(exist_ok=True)
          with ZipFile('site.zip') as z:
              z.extractall(root)
          target=root/'preview-v517'
          target.mkdir()
          shutil.copytree(root/'assets',target/'assets')
          html=(root/'index.html').read_text(encoding='utf-8')
          for layer in ('512','513','514'):
              for ext in ('css','js'):
                  src=Path('preview')/f'v{layer}.{ext}'
                  shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
              html=html.replace('</body>',f'<script src="v{layer}.js"></script>\n</body>',1)
          src=Path('preview/v515.css')
          shutil.copy2(src,target/src.name)
          html=html.replace('</head>','<link rel="stylesheet" href="v515.css"/>\n</head>',1)
          for layer in ('516','517'):
              for ext in ('css','js'):
                  src=Path('preview')/f'v{layer}.{ext}'
                  shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
              html=html.replace('</body>',f'<script src="v{layer}.js"></script>\n</body>',1)
          (target/'index.html').write_text(html,encoding='utf-8')
          assert html.count('v517.css')==1 and html.count('v517.js')==1
          PY
      - name: Run illustrated menu interaction tests
        run: |
          python3 -m http.server 8765 -d public >/tmp/stuffedsaurus-http.log 2>&1 &
          npx playwright test qa/v517.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v517-illustrated-menu-screenshots
          path: test-results/
          if-no-files-found: ignore
