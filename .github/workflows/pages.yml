name: Publish StuffedSaurus preview
on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - 'preview/v511.css'
      - 'preview/v512.css'
      - 'preview/v512.js'
      - 'preview/v513.css'
      - 'preview/v513.js'
      - 'preview/v514.css'
      - 'preview/v514.js'
      - 'preview/v515.css'
      - 'preview/v516.css'
      - 'preview/v516.js'
      - 'preview/v517.css'
      - 'preview/v517.js'
      - 'preview/v518.css'
      - 'preview/v518.js'
      - 'preview/v519.css'
      - 'preview/v519.js'
      - 'preview/v520.css'
      - 'preview/v520.js'
      - 'preview/instagram-recent.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stuffedsaurus-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check for upload
        id: bundle
        shell: bash
        run: |
          if [ -s site.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Upload site.zip to publish the site."
          fi

      - name: Unpack the approved site bundle
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p public
          unzip -q site.zip -d public
          test -f public/index.html
          test -f public/assets/hero-wide.webp
          test -f public/assets/hero-mobile-v56.webp
          if grep -q 'スタッフザウルス' public/index.html; then
            echo "Incorrect Japanese brand spelling found"
            exit 1
          fi

      - name: Build isolated V5.11 review page (keep live home unchanged)
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/stuffedsaurus-v511
          cp -a public/. /tmp/stuffedsaurus-v511/
          cp preview/v511.css /tmp/stuffedsaurus-v511/v511.css
          python3 - <<'PY'
          from pathlib import Path
          file = Path('/tmp/stuffedsaurus-v511/index.html')
          html = file.read_text(encoding='utf-8')
          assert '</head>' in html
          html = html.replace('</head>', '<link rel="stylesheet" href="v511.css"/>\n</head>', 1)
          file.write_text(html, encoding='utf-8')
          PY
          mv /tmp/stuffedsaurus-v511 public/preview-v511
          test -f public/preview-v511/index.html
          test -f public/index.html

      - name: Build V5.12 review page without changing the live site
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/stuffedsaurus-v512
          cp -a public/assets /tmp/stuffedsaurus-v512/
          cp public/index.html /tmp/stuffedsaurus-v512/index.html
          cp preview/v512.css /tmp/stuffedsaurus-v512/v512.css
          cp preview/v512.js /tmp/stuffedsaurus-v512/v512.js
          python3 - <<'PY'
          from pathlib import Path
          file = Path('/tmp/stuffedsaurus-v512/index.html')
          html = file.read_text(encoding='utf-8')
          assert '</head>' in html and '</body>' in html
          html = html.replace('</head>', '<link rel="stylesheet" href="v512.css"/>\n</head>', 1)
          html = html.replace('</body>', '<script src="v512.js"></script>\n</body>', 1)
          file.write_text(html, encoding='utf-8')
          PY
          mv /tmp/stuffedsaurus-v512 public/preview-v512
          test -f public/index.html
          test -f public/preview-v512/index.html

      - name: Build isolated V5.13 and V5.14 review pages
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('public')
          for version in ('513', '514'):
              target = base / f'preview-v{version}'
              target.mkdir(parents=True, exist_ok=True)
              shutil.copytree(base / 'assets', target / 'assets')
              html = (base / 'index.html').read_text(encoding='utf-8')
              for layer in (('512', '513') if version == '513' else ('512', '513', '514')):
                  for ext in ('css', 'js'):
                      shutil.copy2(Path('preview') / f'v{layer}.{ext}', target / f'v{layer}.{ext}')
                  html = html.replace('</head>', f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>', 1)
                  html = html.replace('</body>', f'<script src="v{layer}.js"></script>\n</body>', 1)
              (target / 'index.html').write_text(html, encoding='utf-8')
              assert (target / 'index.html').exists()
          PY

      - name: Promote approved V5.14 to homepage (retain original archive)
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          test -f public/preview-v514/index.html
          cp public/preview-v514/index.html public/index.html
          for layer in 512 513 514; do
            cp "public/preview-v514/v${layer}.css" "public/v${layer}.css"
            cp "public/preview-v514/v${layer}.js" "public/v${layer}.js"
          done
          test -f public/assets/hero-wide.webp
          test -f public/v514.css
          grep -q 'v514.css' public/index.html

      - name: Build isolated V5.15 editorial review
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p public/preview-v515
          cp -a public/assets public/preview-v515/assets
          cp public/index.html public/preview-v515/index.html
          for layer in 512 513 514; do
            cp "public/v${layer}.css" "public/preview-v515/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v515/v${layer}.js"
          done
          cp preview/v515.css public/preview-v515/v515.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v515/index.html')
          s=p.read_text(encoding='utf-8')
          assert '</head>' in s
          p.write_text(s.replace('</head>', '<link rel="stylesheet" href="v515.css"/>\n</head>',1),encoding='utf-8')
          PY
          grep -q 'v515.css' public/preview-v515/index.html

      - name: Promote reviewed V5.15 to homepage (retain V5.14 for rollback)
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f public/preview-v515/index.html
          cp public/preview-v515/index.html public/index.html
          cp public/preview-v515/v515.css public/v515.css
          test -f public/preview-v514/index.html
          test -f public/assets/hero-wide.webp
          test -f public/assets/hero-mobile-v56.webp
          grep -q 'v514.css' public/index.html
          grep -q 'v515.css' public/index.html
          echo 'V5.15 homepage staged; original archive and V5.14 preview retained.'

      - name: Build V5.16 town-navigation preview (homepage stays V5.15)
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/preview-v516
          cp -a public/assets public/preview-v516/assets
          cp public/index.html public/preview-v516/index.html
          for layer in 512 513 514; do
            cp "public/v${layer}.css" "public/preview-v516/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v516/v${layer}.js"
          done
          cp public/v515.css public/preview-v516/v515.css
          cp preview/v516.css public/preview-v516/v516.css
          cp preview/v516.js public/preview-v516/v516.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v516/index.html')
          s=p.read_text(encoding='utf-8')
          assert '</head>' in s and '</body>' in s
          s=s.replace('</head>', '<link rel="stylesheet" href="v516.css"/>\n</head>',1)
          s=s.replace('</body>', '<script src="v516.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f public/preview-v516/index.html
          grep -q 'v516.js' public/preview-v516/index.html
          ! grep -q 'v516.js' public/index.html

      - name: Promote approved V5.16 town navigation to homepage
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f public/preview-v516/index.html
          cp public/preview-v516/index.html public/index.html
          cp public/preview-v516/v516.css public/v516.css
          cp public/preview-v516/v516.js public/v516.js
          test -f public/preview-v515/index.html
          test -f public/preview-v514/index.html
          test -f public/assets/hero-wide.webp
          grep -q 'v515.css' public/index.html
          grep -q 'v516.css' public/index.html
          grep -q 'v516.js' public/index.html
          echo 'V5.16 homepage assembled; older releases preserved for rollback.'

      - name: Assemble isolated V5.17 illustrated menu preview
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/preview-v517
          cp -a public/assets public/preview-v517/assets
          cp public/index.html public/preview-v517/index.html
          for layer in 512 513 514 516; do
            cp "public/v${layer}.css" "public/preview-v517/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v517/v${layer}.js"
          done
          cp public/v515.css public/preview-v517/v515.css
          cp preview/v517.css public/preview-v517/v517.css
          cp preview/v517.js public/preview-v517/v517.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v517/index.html')
          html=p.read_text(encoding='utf-8')
          assert 'v516.js' in html and 'v515.css' in html
          html=html.replace('</head>','<link rel="stylesheet" href="v517.css"/>\n</head>',1)
          html=html.replace('</body>','<script src="v517.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
          grep -q 'v517.js' public/preview-v517/index.html
          ! grep -q 'v517.js' public/index.html

      - name: Promote reviewed V5.17 illustrated menu to homepage
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f public/preview-v517/index.html
          cp public/preview-v517/index.html public/index.html
          cp public/preview-v517/v517.css public/v517.css
          cp public/preview-v517/v517.js public/v517.js
          test -f public/preview-v516/index.html
          test -f public/preview-v515/index.html
          test -f public/assets/hero-wide.webp
          test -f public/assets/hero-mobile-v56.webp
          grep -q 'v516.js' public/index.html
          grep -q 'v517.css' public/index.html
          grep -q 'v517.js' public/index.html
          echo 'V5.17 illustrated menu promoted, V5.16 rollback remains available.'

      - name: Assemble V5.18 home card order and preserve previous previews
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/preview-v518
          cp -a public/assets public/preview-v518/assets
          cp public/index.html public/preview-v518/index.html
          for layer in 512 513 514 516 517; do
            cp "public/v${layer}.css" "public/preview-v518/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v518/v${layer}.js"
          done
          cp public/v515.css public/preview-v518/v515.css
          cp preview/v518.css public/preview-v518/v518.css
          cp preview/v518.js public/preview-v518/v518.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v518/index.html')
          html=p.read_text(encoding='utf-8')
          assert 'v517.js' in html and 'v515.css' in html
          html=html.replace('</head>','<link rel="stylesheet" href="v518.css"/>\n</head>',1)
          html=html.replace('</body>','<script src="v518.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
          test -f public/preview-v517/index.html
          cp public/preview-v518/index.html public/index.html
          cp public/preview-v518/v518.css public/v518.css
          cp public/preview-v518/v518.js public/v518.js
          grep -q 'v518.css' public/index.html
          grep -q 'v518.js' public/index.html

      - name: Build V5.19 character conversations and preserve previous version
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/preview-v519
          cp -a public/assets public/preview-v519/assets
          cp public/index.html public/preview-v519/index.html
          for layer in 512 513 514 516 517 518; do
            cp "public/v${layer}.css" "public/preview-v519/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v519/v${layer}.js"
          done
          cp public/v515.css public/preview-v519/v515.css
          cp preview/v519.css public/preview-v519/v519.css
          cp preview/v519.js public/preview-v519/v519.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v519/index.html')
          html=p.read_text(encoding='utf-8')
          assert 'v518.js' in html
          html=html.replace('</head>','<link rel="stylesheet" href="v519.css"/>\n</head>',1)
          html=html.replace('</body>','<script src="v519.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
          test -f public/preview-v518/index.html
          test -f public/preview-v519/index.html
          cp public/preview-v519/index.html public/index.html
          cp public/preview-v519/v519.css public/v519.css
          cp public/preview-v519/v519.js public/v519.js
          grep -q 'v519.css' public/index.html
          grep -q 'v519.js' public/index.html

      - name: Build recent Instagram reel gallery (keep V5.19 rollback)
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/preview-v520
          cp -a public/assets public/preview-v520/assets
          cp public/index.html public/preview-v520/index.html
          for layer in 512 513 514 516 517 518 519; do
            cp "public/v${layer}.css" "public/preview-v520/v${layer}.css"
            cp "public/v${layer}.js" "public/preview-v520/v${layer}.js"
          done
          cp public/v515.css public/preview-v520/v515.css
          cp preview/v520.css public/preview-v520/v520.css
          cp preview/v520.js public/preview-v520/v520.js
          cp preview/instagram-recent.json public/preview-v520/instagram-recent.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/preview-v520/index.html')
          html=p.read_text(encoding='utf-8')
          assert 'v519.js' in html
          html=html.replace('</head>','<link rel="stylesheet" href="v520.css"/>\n</head>',1)
          html=html.replace('</body>','<script src="v520.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
          test -f public/preview-v519/index.html
          cp public/preview-v520/index.html public/index.html
          cp public/preview-v520/v520.css public/v520.css
          cp public/preview-v520/v520.js public/v520.js
          cp public/preview-v520/instagram-recent.json public/instagram-recent.json
          grep -q 'v520.css' public/index.html
          grep -q 'v520.js' public/index.html
          python3 -m json.tool public/instagram-recent.json >/dev/null

      - name: Version Instagram stylesheet after V5.22 aspect ratio fix
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          original='href="v520.css"'
          assert html.count(original)==1, 'Expected V5.20 Instagram stylesheet missing'
          html=html.replace(original,'href="v520.css?v522"',1)
          p.write_text(html,encoding='utf-8')
          PY
          test -f public/v520.css
          grep -q 'v520.css?v522' public/index.html

      - name: Publish V5.23 full-ratio Instagram previews without stale assets
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          assert 'href="v520.css?v522"' in html
          assert 'src="v520.js"' in html
          html=html.replace('href="v520.css?v522"','href="v520.css?v523"',1)
          html=html.replace('src="v520.js"','src="v520.js?v523"',1)
          p.write_text(html,encoding='utf-8')
          PY
          test -f public/v520.js
          test -f public/v520.css
          grep -q 'v520.js?v523' public/index.html

      - name: Configure GitHub Pages
        if: steps.bundle.outputs.present == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website files
        if: steps.bundle.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy preview
        if: steps.bundle.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
