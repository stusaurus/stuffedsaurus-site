name: Publish StuffedSaurus preview
on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stuffedsaurus-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check for upload
        id: bundle
        shell: bash
        run: |
          if [ -s site.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Upload site.zip to publish the site."
          fi

      - name: Unpack the approved site bundle
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p public
          unzip -q site.zip -d public
          test -f public/index.html
          test -f public/assets/hero-wide.webp
          test -f public/assets/hero-mobile-v56.webp
          if grep -q 'スタッフザウルス' public/index.html; then
            echo "Incorrect Japanese brand spelling found"
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.bundle.outputs.present == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website files
        if: steps.bundle.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy preview
        if: steps.bundle.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
