name: V5.16 navigation preview + release QA
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'qa/**'
      - 'site.zip'
      - '.github/workflows/pages.yml'
      - '.github/workflows/v516-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Build isolated V5.16 preview
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import shutil
          root=Path('public')
          root.mkdir(exist_ok=True)
          with ZipFile('site.zip') as z:
              z.extractall(root)
          target=root/'preview-v516'
          target.mkdir()
          shutil.copytree(root/'assets',target/'assets')
          html=(root/'index.html').read_text(encoding='utf-8')
          for layer in ('512','513','514'):
              for ext in ('css','js'):
                  src=Path('preview')/f'v{layer}.{ext}'
                  shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
              html=html.replace('</body>',f'<script src="v{layer}.js"></script>\n</body>',1)
          for layer in ('515','516'):
              src=Path('preview')/f'v{layer}.css'
              shutil.copy2(src,target/src.name)
              html=html.replace('</head>',f'<link rel="stylesheet" href="v{layer}.css"/>\n</head>',1)
          shutil.copy2(Path('preview/v516.js'),target/'v516.js')
          html=html.replace('</body>','<script src="v516.js"></script>\n</body>',1)
          (target/'index.html').write_text(html,encoding='utf-8')
          assert 'v516.js' in html and 'v516.css' in html
          shutil.copy2(target/'index.html',root/'index.html')
          for layer in ('512','513','514'):
              for ext in ('css','js'):
                  shutil.copy2(target/f'v{layer}.{ext}',root/f'v{layer}.{ext}')
          shutil.copy2(target/'v515.css',root/'v515.css')
          for ext in ('css','js'):
              shutil.copy2(target/f'v516.{ext}',root/f'v516.{ext}')
          assert 'v516.js' in (root/'index.html').read_text(encoding='utf-8')
          PY
      - name: Test menu semantics and layouts
        run: |
          python3 -m http.server 8765 -d public >/tmp/http.log 2>&1 &
          npx playwright test qa/v516.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v516-menu-screenshots
          path: test-results/
          if-no-files-found: ignore
