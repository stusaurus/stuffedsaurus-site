name: V5.31 iPhone touch and pose visibility QA
on:
  pull_request:
    paths:
      - 'preview/v531.*'
      - 'qa/v531.spec.cjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/v531-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-pose-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit browser engines
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Confirm all five approved images remain byte-identical
        run: (cd preview/reactions/tiranon && sha256sum -c SHA256SUMS)
      - name: Assemble live V5.29 layout with the V5.31 replacement director
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from shutil import copy2,copytree
          out=Path('public')
          out.mkdir(exist_ok=True)
          with ZipFile('site.zip') as z:z.extractall(out)
          html=(out/'index.html').read_text(encoding='utf-8')
          for version in ('512','513','514','515','516','517','518','519','520','525','526','527','528','529','530','531'):
              for ext in ('css','js'):
                  if version=='530' and ext=='js': continue
                  src=Path('preview')/f'v{version}.{ext}'
                  if not src.exists():continue
                  copy2(src,out/src.name)
                  anchor='</head>' if ext=='css' else '</body>'
                  insert=(f'<link rel="stylesheet" href="{src.name}"/>' if ext=='css' else f'<script src="{src.name}"></script>')
                  assert anchor in html
                  html=html.replace(anchor,insert+'\n'+anchor,1)
          copy2(Path('preview/instagram-recent.json'),out/'instagram-recent.json')
          copytree(Path('preview/instagram-covers'),out/'instagram-covers')
          copytree(Path('preview/reactions/tiranon'),out/'reactions/tiranon')
          (out/'index.html').write_text(html,encoding='utf-8')
          assert 'v531.js' in html and 'v530.js' not in html
          PY
      - name: JavaScript syntax
        run: node --check preview/v531.js
      - name: Chromium functional tests
        run: |
          python3 -m http.server 8765 -d public >/tmp/v531-server.log 2>&1 &
          npx playwright test qa/v531.spec.cjs --browser=chromium --reporter=line
      - name: WebKit iPhone-emulation and reduced-motion tests
        run: npx playwright test qa/v531.spec.cjs --browser=webkit --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v531-chromium-webkit-iphone-review
          path: test-results/
          if-no-files-found: ignore
